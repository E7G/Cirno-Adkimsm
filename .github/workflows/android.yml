name: Android CI and Release

on:
  workflow_dispatch:
  push:
    branches: ["main", "clover-rust"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Generate CI signing key
        run: keytool -genkeypair -v -keystore "$CI_KEYSTORE" -storepass "$CI_KEYSTORE_PASSWORD" -keypass "$CI_KEYSTORE_PASSWORD" -alias "$CI_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cirno CI, O=Cirno"
        env:
          CI_KEYSTORE: ${{ runner.temp }}/cirno-release.jks
          CI_KEYSTORE_PASSWORD: cirno-${{ github.run_id }}
          CI_KEY_ALIAS: cirno

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and build release APK
        run: ./gradlew testDebugUnitTest :app:assembleRelease --stacktrace
        env:
          CI_KEYSTORE: ${{ runner.temp }}/cirno-release.jks
          CI_KEYSTORE_PASSWORD: cirno-${{ github.run_id }}
          CI_KEY_ALIAS: cirno

      - name: Verify APK signature and ABI
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cirno-clover-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
